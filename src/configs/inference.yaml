defaults:
  - model: conformer
  - metrics: beam_search
  - datasets: custom_dir
  - dataloader: example
  - transforms: conformer
  - _self_
model:
  n_feats: 80
  n_layers: 8
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
dataloader:
  batch_size: 1
  num_workers: 2
inferencer:
  device_tensors: ["spectrogram", "text_encoded"]
  device: auto
  save_path: "predictions"
  seed: 1
  beam_size: 10
  from_pretrained: "saved/conformer_ctc/model_best.pth"