defaults:
  - model: conformer
  - writer: wandb
  - metrics: example
  - datasets: librispeech
  - dataloader: example
  - transforms: conformer
  - _self_
model:
  n_feats: 80
optimizer:
  _target_: torch.optim.Adam
  lr: 1e-3
  betas: [0.9, 0.98]
  eps: 1e-9
  weight_decay: 1e-6
lr_scheduler:
  _target_: torch.optim.lr_scheduler.OneCycleLR
  max_lr: 1e-3
  pct_start: 0.1
  steps_per_epoch: ${trainer.epoch_len}
  epochs: ${trainer.n_epochs}
  anneal_strategy: cos
loss_function:
  _target_: src.loss.CTCLossWrapper
  zero_infinity: true
text_encoder:
  _target_: src.text_encoder.CTCTextEncoder
dataloader:
  batch_size: 32
  num_workers: 4
writer:
  project_name: "asr_hw"
  run_name: "conformer_ctc"
trainer:
  log_step: 50
  n_epochs: 50
  epoch_len: 1000
  max_grad_norm: 10
  device_tensors: ["spectrogram", "text_encoded"]
  resume_from: null
  device: auto
  override: False
  monitor: "min val_WER_(Argmax)"
  save_period: 5
  early_stop: ${trainer.n_epochs}
  save_dir: "saved"
  seed: 1